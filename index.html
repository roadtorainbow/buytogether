<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>團購表單</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }
    .btn:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>

  <h2>團購訂購單</h2>

  <form id="orderForm">
    <div class="form-group">
      <label for="name">姓名 / 暱稱：</label>
      <input type="text" id="name" required placeholder="請輸入姓名">
    </div>

    <div class="form-group">
      <label for="itemSpec">品項與規格：</label>
      <input type="text" id="itemSpec" value="柴魚片 [大包裝]" readonly>
    </div>

    <div class="form-group">
      <label for="qty">數量：</label>
      <input type="number" id="qty" min="1" value="1" required>
    </div>

    <div class="form-group">
      <label for="price">單價：</label>
      <input type="number" id="price" value="250" readonly>
    </div>

    <button type="submit" class="btn">送出訂單</button>
  </form>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxtEkeKQHvbHmbKoVaZfyMwwGxroGsGlGJqN_Qb8TugSgekZvsqEme5ontdSoVKURq3aw/exec";

    document.getElementById("orderForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const qty = parseInt(document.getElementById("qty").value, 10);
      const price = parseFloat(document.getElementById("price").value);
      const total = qty * price;

      const payload = {
        name: name,
        items: `柴魚片 [大包裝] x${qty}`,
        total: total,
        lines: [
          {
            name: "柴魚片",
            spec: "大包裝",
            price: price,
            qty: qty,
            free: 0
          }
        ]
      };

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "text/plain"
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        alert("訂單已成功送出！");
        document.getElementById("orderForm").reset();
      })
      .catch(error => {
        console.error("傳送失敗:", error);
        alert("送出失敗，請重試");
      });
    });
  </script>

</body>
</html>
